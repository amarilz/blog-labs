version: "3.8"

services:
    cassandra1:
        image: cassandra:5.0.6
        container_name: cassandra1
        hostname: cassandra1
        networks:
            cnet:
                ipv4_address: 172.30.0.11
        environment:
            CASSANDRA_CLUSTER_NAME: "rr-cluster"
            CASSANDRA_SEEDS: "172.30.0.11"
            CASSANDRA_DC: "dc1"
            CASSANDRA_RACK: "rack1"
            CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"

            # internode
            CASSANDRA_LISTEN_ADDRESS: "172.30.0.11"
            CASSANDRA_BROADCAST_ADDRESS: "172.30.0.11"

            # client
            CASSANDRA_RPC_ADDRESS: "0.0.0.0"
            CASSANDRA_BROADCAST_RPC_ADDRESS: "172.30.0.11"

            MAX_HEAP_SIZE: "512M"
            HEAP_NEWSIZE: "128M"
        volumes:
            - cass1_data:/var/lib/cassandra
        ports:
            - "9042:9042"
        ulimits:
            memlock: -1
            nofile:
                soft: 100000
                hard: 100000
        healthcheck:
            test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' 127.0.0.1 9042 || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 40
            start_period: 30s

    cassandra2:
        image: cassandra:5.0.6
        container_name: cassandra2
        hostname: cassandra2
        depends_on:
            cassandra1:
                condition: service_healthy
        networks:
            cnet:
                ipv4_address: 172.30.0.12
        environment:
            CASSANDRA_CLUSTER_NAME: "rr-cluster"
            CASSANDRA_SEEDS: "172.30.0.11"
            CASSANDRA_DC: "dc1"
            CASSANDRA_RACK: "rack1"
            CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"

            CASSANDRA_LISTEN_ADDRESS: "172.30.0.12"
            CASSANDRA_BROADCAST_ADDRESS: "172.30.0.12"
            CASSANDRA_RPC_ADDRESS: "0.0.0.0"
            CASSANDRA_BROADCAST_RPC_ADDRESS: "172.30.0.12"

            MAX_HEAP_SIZE: "512M"
            HEAP_NEWSIZE: "128M"
        volumes:
            - cass2_data:/var/lib/cassandra
        ports:
            - "9043:9042"
        ulimits:
            memlock: -1
            nofile:
                soft: 100000
                hard: 100000
        healthcheck:
            test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' 127.0.0.1 9042 || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 40
            start_period: 30s

    cassandra3:
        image: cassandra:5.0.6
        container_name: cassandra3
        hostname: cassandra3
        depends_on:
            cassandra2:
                condition: service_healthy
        networks:
            cnet:
                ipv4_address: 172.30.0.13
        environment:
            CASSANDRA_CLUSTER_NAME: "rr-cluster"
            CASSANDRA_SEEDS: "172.30.0.11"
            CASSANDRA_DC: "dc1"
            CASSANDRA_RACK: "rack1"
            CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"

            CASSANDRA_LISTEN_ADDRESS: "172.30.0.13"
            CASSANDRA_BROADCAST_ADDRESS: "172.30.0.13"
            CASSANDRA_RPC_ADDRESS: "0.0.0.0"
            CASSANDRA_BROADCAST_RPC_ADDRESS: "172.30.0.13"

            MAX_HEAP_SIZE: "512M"
            HEAP_NEWSIZE: "128M"
        volumes:
            - cass3_data:/var/lib/cassandra
        ports:
            - "9044:9042"
        ulimits:
            memlock: -1
            nofile:
                soft: 100000
                hard: 100000
        healthcheck:
            test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' 127.0.0.1 9042 || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 40
            start_period: 30s

networks:
    cnet:
        driver: bridge
        ipam:
            config:
                - subnet: 172.30.0.0/24

volumes:
    cass1_data:
    cass2_data:
    cass3_data:
